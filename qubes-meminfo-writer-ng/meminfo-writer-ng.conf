# qubes-meminfo-writer-ng configuration (TOML format)

# Memory change threshold in kB that triggers a xenstore write.
# A lower value means more frequent updates (higher xenstore traffic).
# Must be a positive integer.
threshold_kb = 30000

# Update interval in microseconds between memory samples.
# Must be a positive integer.
delay_us = 100000

# Swap weight rules – optional.
#
# For each active swap device or file the first matching [[swap]] rule is
# applied: the device's used-kB value is multiplied by the rule's weight
# before being summed into the total used-memory value reported to xenstore.
#
# weight = 1.0  – count swap usage in full (default when no rule matches)
# weight = 0.5  – count only half the used-swap (e.g. for compressed zram)
# weight = 0.0  – ignore this swap device entirely
#
# Rules are evaluated top-to-bottom; the first match wins.
# The glob pattern is matched against the full device/file path (/proc/swaps).
# Supported wildcards: * (any sequence of characters), ? (any single char).
#
# Examples (uncomment to enable):
#
# [[swap]]
# glob = "/dev/zram*"
# weight = 0.5
#
# [[swap]]
# glob = "*"
# weight = 1.0
